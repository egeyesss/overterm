[package]
name = "overterm"
description = "Agent-aware floating terminal."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
overterm-core = { path = "../crates/core" }
# tray-icon for the menu bar item. Without a Dock icon it is the only
# place to click the app, so it is not optional on macOS.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# Already in the lock. The settings file format is a locked decision.
toml = "1"
# Already in the tree through the core crate. Detection patterns are
# compiled here so a bad one in the settings file is reported once, at
# the point somebody could fix it.
regex = "1"
serde.workspace = true
serde_json.workspace = true
# Hands a URL to the user's browser. Without it a link clicked in the
# terminal navigates the webview itself and the app becomes a browser.
tauri-plugin-opener = "2.5.4"

# The non-activating floating panel the overlay needs exists only on
# NSPanel, which Tauri does not create. These are already in the tree
# through wry, so using them directly costs no extra dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree through portable-pty. Used to ask the kernel what
# program owns a session's terminal, which is how a tab knows its agent.
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPanel", "NSResponder", "NSWindow"] }
objc2-foundation = "0.3"
