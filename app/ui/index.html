<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OverTerm</title>
  </head>
  <body class="mode-panel">
    <!-- The window has no system titlebar, so this strip is what the user
         grabs to move it. -->
    <header id="titlebar" data-tauri-drag-region>
      <span id="title" data-tauri-drag-region>OverTerm</span>
      <div class="controls">
        <span class="pill" id="status" title="Detected agent state">
          <span class="dot"></span>
          <span class="label">idle</span>
          <span class="elapsed"></span>
        </span>
        <button class="icon collapse" title="Collapse to the bar">
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2 2.5h8M6 9.5 3.5 6.5h5z" />
          </svg>
        </button>
        <button class="icon hide" title="Hide the window (Cmd+Shift+O brings it back)">
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2 9.5h8" />
          </svg>
        </button>
      </div>
    </header>

    <div id="terminal"></div>

    <!-- Overlay rather than a row, so opening it does not resize the
         terminal and reflow the agent's TUI. -->
    <div id="find" hidden>
      <input
        id="find-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="find"
      />
      <span id="find-count"></span>
      <button class="icon find-prev" title="Previous match (Shift+Enter)">
        <svg viewBox="0 0 12 12" aria-hidden="true">
          <path d="M6 3 3 7h6z" />
        </svg>
      </button>
      <button class="icon find-next" title="Next match (Enter)">
        <svg viewBox="0 0 12 12" aria-hidden="true">
          <path d="M6 9 3 5h6z" />
        </svg>
      </button>
      <button class="icon find-close" title="Close (Esc)">
        <svg viewBox="0 0 12 12" aria-hidden="true">
          <path d="m3 3 6 6M9 3l-6 6" />
        </svg>
      </button>
    </div>

    <!-- Compact strip shown while the agent works. -->
    <div id="bar">
      <div id="bar-top" data-tauri-drag-region>
        <span class="pill" id="bar-pill">
          <span class="dot"></span>
          <span class="label">idle</span>
          <span class="elapsed"></span>
        </span>
        <span id="bar-line"></span>
        <div class="controls">
          <button class="icon expand" title="Show the full terminal">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path d="M2 9.5h8M6 2.5 3.5 5.5h5z" />
            </svg>
          </button>
          <button class="icon hide" title="Hide the window (Cmd+Shift+O brings it back)">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path d="M2 9.5h8" />
            </svg>
          </button>
        </div>
      </div>
      <div id="bar-bottom">
        <span class="prompt">&#10095;</span>
        <input
          id="bar-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="type here to talk to the session"
        />
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
