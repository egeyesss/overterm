[workspace]
resolver = "3"
members = ["crates/core", "app"]

[workspace.package]
version = "1.0.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/egeyesss/overterm"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order so editing someone's settings file rewrites our own keys
# and leaves the order of theirs alone. indexmap is already in the tree.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
