name: release

# Pushing a version tag builds the app and publishes it. Cutting a
# release used to be a laptop build, which meant the artifact depended on
# whatever happened to be in that laptop's target directory.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the tree publishes a build named after a
      # version that was never in the source, and nobody notices until
      # somebody reports a bug against it.
      - name: Check the tag against the version in the tree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # v0.2.0-rc.1 is a build of 0.2.0, so compare the release part.
          want="${tag%%-*}"
          conf=$(jq -r .version app/tauri.conf.json)
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag=$want tauri.conf.json=$conf Cargo.toml=$crate"
          if [ "$conf" != "$want" ] || [ "$crate" != "$want" ]; then
            echo "::error::the tag and the version in the tree disagree"
            exit 1
          fi

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      # A universal binary is compiled once per architecture, so both
      # targets have to be installed even though the runner is one of them.
      - name: Add both Mac targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/ui/package-lock.json

      # Unlike the check workflow this does need the frontend, because the
      # bundle it produces is the thing people run.
      - name: Install the build tooling
        run: |
          npm ci
          npm ci --prefix app/ui

      - name: Build
        run: npm run tauri build -- --target universal-apple-darwin

      # A green build proves the code compiles and says nothing about what
      # ended up in the bundle. The first 0.1.0 build predated the
      # uninstall flag and would have shipped without it, because cargo had
      # rebuilt and the bundle had not.
      - name: Check the artifact
        run: |
          set -eu
          app=target/universal-apple-darwin/release/bundle/macos/oTerm.app
          bin="$app/Contents/MacOS/overterm"
          version=$(jq -r .version app/tauri.conf.json)

          archs=$(lipo -archs "$bin")
          echo "architectures: $archs"
          for want in arm64 x86_64; do
            case " $archs " in
              *" $want "*) ;;
              *) echo "::error::the binary is missing $want"; exit 1 ;;
            esac
          done

          # The bundle carries its own copy of the version, so this is what
          # catches a rebuilt binary sitting inside a stale bundle.
          built=$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")
          echo "bundle version: $built"
          if [ "$built" != "$version" ]; then
            echo "::error::the bundle says $built and the source says $version"
            exit 1
          fi

          # Runs the real binary out of the real bundle, which proves the
          # app executes and that the flag a package manager calls on the
          # way out is in this build. A runner has no hook entries, so it
          # reports that and changes nothing.
          "$bin" --uninstall-hooks

          # The frontend is built by a separate command, so it can be
          # missing from a build that reported success.
          test -s app/ui/dist/index.html \
            || { echo "::error::the frontend was never built"; exit 1; }

      - name: Package the app
        run: |
          set -eu
          bundle=target/universal-apple-darwin/release/bundle
          version=$(jq -r .version app/tauri.conf.json)
          mkdir -p dist

          # A tarball as well as the disk image. The install script pulls
          # this one, and unpacking a tarball is one command where getting
          # a single app out of a disk image is a mount and a copy and an
          # unmount. Its name carries no version so the download URL for
          # the newest release is always the same, which is what lets the
          # install script stay untouched between releases.
          COPYFILE_DISABLE=1 tar -czf dist/oTerm_universal.tar.gz \
            -C "$bundle/macos" oTerm.app

          # The disk image keeps its versioned name: the Homebrew cask
          # builds its URL out of the version.
          cp "$bundle/dmg/oTerm_${version}_universal.dmg" dist/

          cd dist
          for f in oTerm_universal.tar.gz "oTerm_${version}_universal.dmg"; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          # A tag with a hyphen in it is a release candidate. Marking it as
          # a prerelease keeps it out of the "latest" that the install
          # script downloads, so trying one out cannot hand it to everyone.
          case "$tag" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          elif [ "$prerelease" = true ]; then
            gh release create "$tag" dist/* --title "$tag" --generate-notes --prerelease
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi

  # Homebrew is the one place a release does not reach on its own, and
  # forgetting it is not hypothetical: 1.0.2 shipped and the cask sat on
  # 1.0.1 until somebody noticed two releases later.
  cask:
    needs: release
    runs-on: ubuntu-latest
    # A release candidate must never become what brew installs. Same rule
    # the publish step applies, written the same way: a hyphen in the tag
    # means it is a candidate.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      # The tap is a different repository, so the token this workflow gets
      # by default cannot reach it. TAP_TOKEN is a repository secret
      # holding a personal access token that can: a fine-grained one
      # scoped to egeyesss/homebrew-overterm with read and write on
      # contents and on pull requests is enough.
      #
      # Missing it leaves the cask alone and says so, rather than failing
      # a release that is otherwise finished and published. Somebody
      # cloning this repo has no such secret and no tap to push to, and
      # their releases should still work.
      - name: Check for the token that reaches the tap
        id: token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN:-}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_TOKEN is not set, so the Homebrew cask still points at the previous release. Update Casks/overterm.rb by hand."
          fi

      - name: Check out the tap
        if: steps.token.outputs.have == 'true'
        uses: actions/checkout@v4
        with:
          repository: egeyesss/homebrew-overterm
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Point the cask at this release
        if: steps.token.outputs.have == 'true'
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          dmg="oTerm_${version}_universal.dmg"

          # Downloaded back out of the published release rather than taken
          # from the build directory. What the cask promises is the
          # checksum of the file people will actually fetch, and those are
          # only the same file if the upload went the way it was meant to.
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --pattern "$dmg" --dir .
          sha=$(sha256sum "$dmg" | cut -d' ' -f1)

          cask=tap/Casks/overterm.rb
          # Anchored to the start of the line so this cannot match a
          # version or a checksum mentioned anywhere else in the file.
          sed -i -E \
            -e "s/^(  version )\"[^\"]*\"/\1\"${version}\"/" \
            -e "s/^(  sha256 )\"[^\"]*\"/\1\"${sha}\"/" \
            "$cask"

          # Read back rather than trusted. A sed that matched nothing exits
          # zero and leaves a cask pointing at the previous release with
          # this release's URL, which installs nothing and blames the user.
          grep -q "^  version \"${version}\"$" "$cask" \
            || { echo "::error::the version line was not rewritten"; exit 1; }
          grep -q "^  sha256 \"${sha}\"$" "$cask" \
            || { echo "::error::the sha256 line was not rewritten"; exit 1; }

          if git -C tap diff --quiet; then
            echo "the cask already points here"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      # A pull request rather than a push, because the tap's history is
      # somebody's to review like any other. It is one click, and an open
      # pull request is visible in a way a step nobody ran is not.
      - name: Open the bump on the tap
        if: steps.token.outputs.have == 'true' && steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -eu
          cd tap
          branch="cask-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -qam "Update the cask to ${VERSION}"
          git push -q -u origin "$branch" --force
          # No --base, so this goes to whatever the tap calls its default
          # branch. Asking git for that costs a network round trip and
          # parses human-readable output; gh already knows.
          gh pr create --repo egeyesss/homebrew-overterm \
            --head "$branch" \
            --title "Update the cask to ${VERSION}" \
            --body "Opened by the release workflow for ${GITHUB_REF_NAME}. The checksum was taken from the published disk image rather than from the build, so it is the one people downloading it will get." \
            || echo "::notice::a pull request for $branch is already open"
